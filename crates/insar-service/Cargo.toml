[package]
name = "insar-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent protocol sidecar for EOStage."

[features]
default = []
usgs-m2m-live-acceptance = ["insar-provider/usgs-m2m-live-acceptance"]

[dependencies]
insar-core = { path = "../insar-core" }
insar-download = { path = "../insar-download" }
insar-provider = { path = "../insar-provider" }
insar-store = { path = "../insar-store" }
serde = "1"
serde_json = "1"

[dev-dependencies]
# Tests never pause on a nearly full development drive (W2d test isolation).
insar-download = { path = "../insar-download", features = ["test-plenty-disk-space"] }
