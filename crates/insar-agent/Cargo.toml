[package]
name = "insar-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic local Agent tools, plans, execution, and evidence."

[dependencies]
insar-store = { path = "../insar-store" }
insar-agent-model = { path = "../insar-agent-model" }
insar-core = { path = "../insar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
rusqlite = "0.40"
