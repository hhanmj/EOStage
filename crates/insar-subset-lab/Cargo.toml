[package]
name = "insar-subset-lab"
version = "0.1.0"
edition.workspace = true
rust-version = "1.95.0"
license.workspace = true
repository.workspace = true
publish = false
description = "Non-production local experiments for bounded NISAR HDF5 range subsetting."

[dependencies]
geo = "0.29"
geojson = { version = "0.24", features = ["geo-types"] }
hdf5 = { package = "hdf5-metno", version = "=0.12.6", features = ["static", "zlib"] }
hdf5-sys = { package = "hdf5-metno-sys", version = "=0.12.1" }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
