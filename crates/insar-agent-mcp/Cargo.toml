[package]
name = "insar-agent-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reviewed MCP tool boundary and native stdio client."

[[bin]]
name = "mcp_fixture"
path = "tests/support/mcp_fixture.rs"
required-features = ["internal-test-server"]

[features]
internal-test-server = []

[dependencies]
insar-agent-model = { path = "../insar-agent-model" }
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "server", "transport-child-process", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = "0.7"
